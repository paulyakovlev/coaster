; Waveshare ESP32-S3-ePaper-1.54 — PlatformIO project
; Pin assignments are identical for V1 and V2 hardware revisions.
; Set up for V2. For a V1 board, change memory_type to qio_qspi.

[platformio]
; Plain `pio run` builds the firmware, not the simulator.
default_envs = waveshare-epaper-154

[env:waveshare-epaper-154]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; V2 board: ESP32-S3-PICO-1 with 8 MB embedded flash (quad) and 8 MB
; embedded octal PSRAM, as reported by `esptool flash-id`. Matches
; CONFIG_SPIRAM_MODE_OCT in the vendor's ESP-IDF/V2 sdkconfigs.
; The epaper driver allocates its buffer in PSRAM (heap_caps_malloc SPIRAM).
board_build.arduino.memory_type = qio_opi

; One app slot and a large LittleFS partition for rides, see partitions.csv
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.0

; Main firmware with a made-up ride instead of the GPS, for testing at a desk.
; Run: pio run -e fake-ride -t upload && pio device monitor
[env:fake-ride]
extends = env:waveshare-epaper-154
build_flags =
    ${env:waveshare-epaper-154.build_flags}
    -DFAKE_RIDE

; GPS test firmware: raw NMEA and parsed fixes over serial.
; Run: pio run -e gps-test -t upload && pio device monitor
[env:gps-test]
extends = env:waveshare-epaper-154
build_src_filter = -<*> +<../hwtest/gps_test.cpp>

; Refresh test firmware: 1 Hz partial refreshes, timings over serial.
; Run: pio run -e refresh-test -t upload && pio device monitor
[env:refresh-test]
extends = env:waveshare-epaper-154
build_src_filter = -<*> +<../hwtest/refresh_test.cpp>

; Barometer test firmware: I2C scan, then BMP280 readings over serial.
; Run: pio run -e baro-test -t upload && pio device monitor
[env:baro-test]
extends = env:waveshare-epaper-154
build_src_filter = -<*> +<../hwtest/baro_test.cpp>

; Sound test firmware: button sounds through the onboard ES8311 and speaker.
; Run: pio run -e sound-test -t upload && pio device monitor
[env:sound-test]
extends = env:waveshare-epaper-154
build_src_filter = -<*> +<../hwtest/sound_test.cpp>

; Screen simulator: runs lib/screen on this computer and saves PNGs.
; Run: pio run -e native -t exec   (writes to sim_out/)
[env:native]
platform = native
build_src_filter = -<*> +<../sim/>
extra_scripts = pre:scripts/native_gfx.py
; Adafruit GFX declares itself Arduino-only; sim/stubs makes it build here
lib_compat_mode = off
; sim/stubs stands in for the Arduino core headers Adafruit GFX needs
build_flags =
    -std=c++17
    -Isim/stubs
    -DARDUINO=100
    ; Unit tests (pio test -e native) compare doubles: lat/lon, distance
    -DUNITY_INCLUDE_DOUBLE
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.0
; Needs Arduino SPI/I2C; sim/stubs has empty versions of its headers
lib_ignore =
    Adafruit BusIO
    epaper_driver
    board_power
    display
