; Waveshare ESP32-S3-ePaper-1.54 — PlatformIO project
; Pin assignments are identical for V1 and V2 hardware revisions.
; If PSRAM allocation fails at boot, verify your module variant and
; change memory_type to qio_opi for OPI-PSRAM modules.

[env:waveshare-epaper-1.54]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Quad-SPI PSRAM — required by epaper driver (heap_caps_malloc SPIRAM)
; sdkconfig from vendor examples shows CONFIG_SPIRAM_MODE_QUAD=y
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.0
