; Waveshare ESP32-S3-ePaper-1.54 — PlatformIO project
; Pin assignments are identical for V1 and V2 hardware revisions.
; If PSRAM allocation fails at boot, verify your module variant and
; change memory_type to qio_opi for OPI-PSRAM modules.

[platformio]
; Plain `pio run` builds and uploads the firmware, not the simulator
default_envs = waveshare-epaper-154

[env:waveshare-epaper-154]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Quad-SPI PSRAM — required by epaper driver (heap_caps_malloc SPIRAM)
; sdkconfig from vendor examples shows CONFIG_SPIRAM_MODE_QUAD=y
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.0

; Refresh test firmware: 1 Hz partial refreshes, timings over serial.
; Run: pio run -e refresh-test -t upload && pio device monitor
[env:refresh-test]
extends = env:waveshare-epaper-154
build_src_filter = -<*> +<../hwtest/refresh_test.cpp>

; Screen simulator: runs lib/screen on this computer and saves PNGs.
; Run: pio run -e native -t exec   (writes to sim_out/)
[env:native]
platform = native
build_src_filter = -<*> +<../sim/>
extra_scripts = pre:scripts/native_gfx.py
; Adafruit GFX declares itself Arduino-only; sim/stubs makes it build here
lib_compat_mode = off
; sim/stubs stands in for the Arduino core headers Adafruit GFX needs
build_flags =
    -std=c++17
    -Isim/stubs
    -DARDUINO=100
    ; Unit tests (pio test -e native) compare doubles: lat/lon, distance
    -DUNITY_INCLUDE_DOUBLE
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.0
; Needs Arduino SPI/I2C; sim/stubs has empty versions of its headers
lib_ignore =
    Adafruit BusIO
    epaper_driver
    board_power
    display
